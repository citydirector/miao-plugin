name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天国际标准时间0点（北京时间早8点）运行一次
  workflow_dispatch: # 允许你手动点击按钮触发同步

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
    # 第一步：检出你的代码
    - name: Checkout target repo
      uses: actions/checkout@v3

    # 第二步：同步上游代码
    - name: Sync upstream changes
      id: sync
      uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
      with:
        upstream_sync_repo: yoimiya-kokomi/miao-plugin # 原作者/原仓库名
        upstream_sync_branch: master    # 原仓库分支
        target_sync_branch: master      # 你的分支（通常也是master）
        target_repo_token: ${{ secrets.GITHUB_TOKEN }} # 自动令牌，无需修改
        test_mode: false

    # 第三步：如果同步失败（通常是因为你有魔改导致冲突），输出提示
    - name: Sync check
      if: failure()
      run: |
        echo "[Error] 由于上游仓库有变动导致冲突，无法自动同步，请手动解决。"
        echo "[Info] 如果你在master分支修改了代码，请尽量保持master纯净，将修改放在其他分支。"

    # 第四步：同步失败时推送 Server酱³ 通知（同 job 内 if: failure() 在失败后仍会执行）
    - name: Notify sync failure
      if: failure()
      env:
        # Server酱³ 完整 sendkey（形如 sctp{uid}t{token}），SDK 会自行解析 uid
        SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
      run: |
        python3 -m venv /tmp/scenv
        /tmp/scenv/bin/pip install -q serverchan-sdk
        /tmp/scenv/bin/python - <<'PY'
        import os
        from serverchan_sdk import sc_send

        repo = os.environ.get("GITHUB_REPOSITORY", "")
        run_id = os.environ.get("GITHUB_RUN_ID", "")
        title = "miao-plugin 上游同步失败"
        desp = (
            "❌ miao-plugin 自动同步上游失败，请手动解决冲突。\n\n"
            "仓库: {repo}\n"
            "运行日志: https://github.com/{repo}/actions/runs/{run_id}"
        ).format(repo=repo, run_id=run_id)
        try:
            resp = sc_send(
                os.environ["SC3_SENDKEY"],
                title,
                desp,
                {"tags": "miao-plugin|同步失败"},
            )
            print(resp)
        except Exception as e:
            print(f"通知发送失败: {e}")
        PY
